{% extends 'base.html' %}

{% block content %}
<h3 class="mb-4 font-weight-bold">⏳ Pending Approvals</h3>

<div class="row">
    {% for tutor in tutors %}
    <div class="col-md-6 col-lg-4 mb-3">
        <div class="card shadow-sm border-left-warning h-100">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 font-weight-bold">{{ tutor.username }}</h6>
                    <small class="text-muted">{{ tutor.email }}</small>
                </div>
                <a href="{% url 'approve_tutor' tutor.id %}" class="btn btn-sm btn-success shadow-sm">
                    <i class="fas fa-check mr-1"></i>Approve
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <div class="text-muted">
            <i class="fas fa-thumbs-up fa-3x mb-3"></i>
            <p>All caught up! No pending tutor applications.</p>
        </div>
    </div>
    {% endfor %}
</div>

<style>
    .border-left-warning { border-left: 4px solid #f6c23e !important; }
</style>
{% endblock %}
