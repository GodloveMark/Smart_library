{% extends 'base.html' %}

{% block content %}
<h2>Tutor Dashboard</h2>

<p>Welcome {{ user.username }}</p>

<a href="{% url 'upload_book' %}">Upload Book</a>

<h3>Your Books</h3>

<ul>
    {% for book in books %}
        <li>{{ book.title }}</li>
    {% empty %}
        <li>No books uploaded yet</li>
    {% endfor %}
</ul>

{% endblock %}
