{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 mt-5">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="font-weight-light mb-0">👤 Create Manager</h3>
                    <p class="small mb-0">Register a new management-level account</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="form-group">
                            <label class="small mb-1 font-weight-bold">Username</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                </div>
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="small mb-1 font-weight-bold">Email Address</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                </div>
                                <input type="email" name="email" class="form-control" placeholder="manager@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="small mb-1 font-weight-bold">Password</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                </div>
                                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                            </div>
                        </div>

                        <div class="form-group mt-4 mb-0">
                            <button type="submit" class="btn btn-primary btn-block shadow-sm">
                                <i class="fas fa-user-plus mr-2"></i>Create Manager Account
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 bg-light">
                    <div class="small"><a href="{% url 'all_users' %}" class="text-muted">Return to User List</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
